services:
  api:
    build: .
    image: production-ml:latest
    env_file: .env
    environment:
      DB_HOST: host.docker.internal
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  dashboard:
    build: .
    image: production-ml:latest
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health').read()",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      - api
    restart: unless-stopped
