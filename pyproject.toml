[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "partrisk"
version = "0.1.0"
description = "Prediksi risiko kegagalan part armada - model, serving, dan API"
requires-python = ">=3.13"
# Dependensi RUNTIME sengaja tidak dideklarasikan di sini - requirements*.txt
# (lihat README) tetap satu-satunya sumber kebenaran versi, dipasang terpisah
# (`pip install -r requirements.lock.txt`) baik di dev maupun di Dockerfile.
# pyproject.toml ini murni supaya `partrisk` bisa di-import sebagai package
# (`pip install -e .`), bukan pengelola dependensi.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/partrisk"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
